<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; script-src 'self'" />
  <title>ShellSmith</title>
  <link rel="stylesheet" href="./dist/bundle.css" />
</head>
<body>
  <div id="app">

    <header id="titlebar">
      <div class="tb-brand no-drag">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
        </svg>
      </div>
      <nav id="menubar" class="no-drag"></nav>
      <div class="tb-drag"><span id="tb-title">ShellSmith</span></div>
      <div id="wincontrols" class="no-drag">
        <button id="win-min" class="win-btn" title="Minimalizovat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="win-max" class="win-btn" title="Maximalizovat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg>
        </button>
        <button id="win-close" class="win-btn danger" title="Zavřít">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </header>

    <div id="toolbar"></div>

    <div id="main">
      <aside id="sidebar">
        <div id="siderail"></div>
        <div id="sidepanels">
          <div id="panel-sessions" class="side-panel"></div>
          <div id="panel-files" class="side-panel" hidden>
            <div class="files-head">
              <span class="files-head-label">Soubory</span>
              <button id="files-split-toggle" class="icon-btn" title="Zobrazit i lokální panel (přetahování mezi nimi)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
              </button>
            </div>
            <div id="files-primary" class="files-pane"></div>
            <div id="files-resize"></div>
            <div id="files-secondary" class="files-pane"></div>
          </div>
        </div>
      </aside>

      <div id="sideresize"></div>

      <section id="work">
        <div id="tabbar">
          <div id="tabstrip"></div>
          <button id="newtab" title="Nový lokální terminál (Ctrl+Shift+T)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div id="tabhost"></div>
      </section>
    </div>

    <div id="transfers"></div>

    <footer id="statusbar">
      <span id="sb-dot" class="sb-dot"></span>
      <span id="sb-session" class="sb-item strong"></span>
      <span id="sb-status" class="sb-item"></span>
      <span id="sb-cwd" class="sb-item grow mono"></span>
      <span id="sb-size" class="sb-item"></span>
      <span id="sb-font" class="sb-item"></span>
      <span id="sb-tabs" class="sb-item"></span>
    </footer>

  </div>
  <script src="./dist/bundle.js"></script>
</body>
</html>
